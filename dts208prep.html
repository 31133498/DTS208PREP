<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTS208PREP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" crossorigin="anonymous">
  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --bg:               #FFF7F3;
      --bg-sidebar:       #FDEEE5;
      --bg-card:          #FFFBF9;
      --bg-assign:        #FFF3EC;
      --accent:           #FF9466;
      --accent-muted:     rgba(255,148,102,0.10);
      --accent-border:    rgba(255,148,102,0.40);
      --text-primary:     #2B2320;
      --text-secondary:   #896E67;
      --text-sidebar:     #55403B;
      --border:           #E8D5C9;
      --border-subtle:    #F2E3DA;
      --shadow:           rgba(43,35,32,0.06);
      --sidebar-w:        282px;
      --topbar-h:         54px;
      --t:                0.20s ease;
      --bg-lab:           #F2EEFF;
      --bg-lab-card:      #FAF8FF;
      --lab-border:       #C8BBEE;
      --lab-accent:       #7455F5;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:               #14120F;
        --bg-sidebar:       #1A1712;
        --bg-card:          #1E1B16;
        --bg-assign:        #211C14;
        --accent:           #FF9466;
        --accent-muted:     rgba(255,148,102,0.13);
        --accent-border:    rgba(255,148,102,0.48);
        --text-primary:     #F5EDE7;
        --text-secondary:   #9A837B;
        --text-sidebar:     #C8B4AC;
        --border:           #2E2520;
        --border-subtle:    #231E1A;
        --shadow:           rgba(0,0,0,0.32);
        --bg-lab:           #1A1728;
        --bg-lab-card:      #1E1B2C;
        --lab-border:       #3A2F62;
        --lab-accent:       #9C83FF;
      }
    }
    :root[data-theme="dark"] {
      --bg:               #14120F;
      --bg-sidebar:       #1A1712;
      --bg-card:          #1E1B16;
      --bg-assign:        #211C14;
      --accent:           #FF9466;
      --accent-muted:     rgba(255,148,102,0.13);
      --accent-border:    rgba(255,148,102,0.48);
      --text-primary:     #F5EDE7;
      --text-secondary:   #9A837B;
      --text-sidebar:     #C8B4AC;
      --border:           #2E2520;
      --border-subtle:    #231E1A;
      --shadow:           rgba(0,0,0,0.32);
      --bg-lab:           #1A1728;
      --bg-lab-card:      #1E1B2C;
      --lab-border:       #3A2F62;
      --lab-accent:       #9C83FF;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      overflow: hidden;
    }

    /* ===== MOBILE TOP BAR ===== */
    .mobile-bar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 300;
    }
    .mobile-brand {
      flex: 1;
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      padding: 7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--t);
    }
    .icon-btn:hover { background: var(--accent-muted); }
    .icon-btn svg { width: 20px; height: 20px; display: block; }

    /* ===== OVERLAY ===== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.42);
      z-index: 250;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .overlay.visible { display: block; opacity: 1; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .brand {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 2px;
      letter-spacing: 0;
    }
    .theme-btn {
      background: var(--accent-muted);
      border: 1px solid var(--accent-border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-primary);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--t);
    }
    .theme-btn:hover { background: var(--accent-border); }
    .theme-btn svg { width: 15px; height: 15px; display: block; }

    /* Search */
    .search-wrap {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      font-size: 13.5px;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--t);
    }
    .search-input::placeholder { color: var(--text-secondary); }
    .search-input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-secondary);
      pointer-events: none;
    }
    .search-results {
      position: absolute;
      top: calc(100% - 2px);
      left: 12px;
      right: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 10px 30px var(--shadow);
      z-index: 100;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    .search-results.open { display: block; }
    .sr-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-subtle);
      transition: background var(--t);
    }
    .sr-item:last-child { border-bottom: none; }
    .sr-item:hover { background: var(--accent-muted); }
    .sr-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--accent-muted);
      color: var(--accent);
      margin-right: 7px;
    }
    .sr-main { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .sr-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
    .sr-empty { padding: 14px; font-size: 13px; color: var(--text-secondary); text-align: center; }

    /* Topic list */
    .topic-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .topic-list::-webkit-scrollbar { width: 4px; }
    .topic-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .topic-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 14px 9px 12px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background var(--t), border-color var(--t);
    }
    .topic-item:hover { background: var(--accent-muted); }
    .topic-item.active {
      background: var(--accent-muted);
      border-left-color: var(--accent);
    }
    .topic-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      min-width: 20px;
      padding-top: 2px;
      flex-shrink: 0;
      line-height: 1;
    }
    .topic-item.active .topic-num { color: var(--accent); }
    .topic-name {
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-sidebar);
      font-weight: 500;
    }
    .topic-item.active .topic-name { color: var(--accent); font-weight: 600; }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg);
      height: 100vh;
      scroll-behavior: smooth;
    }
    .content-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 52px 44px 90px;
    }

    /* Topic header */
    .topic-header {
      margin-bottom: 52px;
      padding-bottom: 28px;
      border-bottom: 2px solid var(--border);
    }
    .topic-eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .topic-header h1 {
      font-size: 33px;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text-primary);
    }

    /* Page block */
    .page-block {
      margin-bottom: 60px;
      scroll-margin-top: 28px;
    }
    .page-block + .page-block {
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    /* Section heading */
    .section-heading {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 20px;
    }

    /* Body text */
    .page-text {
      font-size: 18px;
      line-height: 1.82;
      color: var(--text-primary);
    }
    .page-text p { margin-bottom: 16px; }
    .page-text p:last-child { margin-bottom: 0; }

    /* ===== FORMULAS ===== */
    .formulas-block { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; }
    .formula-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
    }
    .formula-display {
      overflow-x: auto;
      padding: 4px 0;
    }
    .formula-display .katex-display { margin: 0; }
    .formula-context {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
    }
    .formula-raw {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px;
      color: var(--text-secondary);
      background: var(--bg);
      border-radius: 6px;
      padding: 10px 14px;
      overflow-x: auto;
    }

    /* ===== DIAGRAMS ===== */
    .diagrams-block { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; }
    .diagram-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .diagram-caption {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 11px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      line-height: 1.4;
    }
    .diagram-svg-wrap {
      background: #ffffff;
      padding: 28px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }
    .diagram-svg-wrap svg {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .diagram-desc {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 10px 18px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-subtle);
      line-height: 1.55;
    }

    /* ===== TABLES ===== */
    .tables-block { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; }
    .table-scroll {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    thead th {
      background: var(--bg-card);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 13.5px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    tbody td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      vertical-align: top;
      line-height: 1.55;
      font-size: 14.5px;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: var(--accent-muted); }

    /* ===== ASSIGNMENTS ===== */
    .assignments-block { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
    .assignment-callout {
      background: var(--bg-assign);
      border: 1px solid var(--accent-border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .assignment-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .assignment-text {
      font-size: 15.5px;
      line-height: 1.68;
      color: var(--text-primary);
    }

    /* ===== LAB TEST ===== */
    .lab-section {
      margin-top: 70px;
      border: 1px solid var(--lab-border);
      border-radius: 16px;
      overflow: hidden;
      background: var(--bg-lab);
    }
    .lab-head {
      padding: 26px 28px 0;
    }
    .lab-eyebrow {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--lab-accent);
      margin-bottom: 6px;
    }
    .lab-head-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 22px;
    }
    .lab-tabs {
      display: flex;
      gap: 0;
      padding: 0 28px;
      border-bottom: 1px solid var(--lab-border);
    }
    .lab-tab {
      padding: 10px 22px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-secondary);
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      transition: color var(--t), border-color var(--t);
      white-space: nowrap;
    }
    .lab-tab:hover { color: var(--lab-accent); }
    .lab-tab.active {
      color: var(--lab-accent);
      border-bottom-color: var(--lab-accent);
    }
    .lab-body { padding: 26px 28px 28px; }
    .lap-panel { display: none; }
    .lap-panel.active { display: block; }
    .lap-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .lap-progress {
      font-size: 13px;
      font-weight: 600;
      color: var(--lab-accent);
      margin-bottom: 22px;
    }
    .q-card {
      background: var(--bg-lab-card);
      border: 1px solid var(--lab-border);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 12px;
    }
    .q-num {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--lab-accent);
      margin-bottom: 9px;
    }
    .q-text {
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-primary);
      font-weight: 500;
      margin-bottom: 14px;
    }
    .reveal-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--lab-accent);
      background: transparent;
      border: 1.5px solid var(--lab-border);
      border-radius: 7px;
      padding: 7px 16px;
      cursor: pointer;
      transition: background var(--t), color var(--t), border-color var(--t);
    }
    .reveal-btn:hover, .reveal-btn.shown {
      background: var(--lab-accent);
      color: #fff;
      border-color: var(--lab-accent);
    }
    .answer-block {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--lab-border);
      font-size: 15.5px;
      line-height: 1.72;
      color: var(--text-primary);
    }
    .answer-block.open { display: block; }

    /* ===== STATES ===== */
    .center-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 55vh;
      gap: 12px;
      color: var(--text-secondary);
    }
    .center-state .big { font-size: 20px; font-weight: 600; color: var(--text-primary); }
    .center-state .small { font-size: 14px; }

    /* ===== MOBILE ===== */
    @media (max-width: 800px) {
      .mobile-bar { display: flex; }
      .sidebar {
        position: fixed;
        top: 0; left: 0;
        height: 100%;
        z-index: 260;
        transform: translateX(calc(-1 * var(--sidebar-w) - 2px));
        transition: transform 0.22s ease;
        box-shadow: 4px 0 24px rgba(0,0,0,0.18);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-header { padding-top: 60px; }
      .main { padding-top: var(--topbar-h); }
      .content-wrap { padding: 32px 22px 70px; }
      .topic-header h1 { font-size: 26px; }
      .section-heading { font-size: 21px; }
      .page-text { font-size: 17px; }
    }
    @media (max-width: 480px) {
      .content-wrap { padding: 24px 16px 60px; }
      .lab-body { padding: 20px 16px 22px; }
      .lab-tabs { padding: 0 16px; }
      .lab-head { padding: 20px 16px 0; }
    }
  </style>
</head>
<body>

<!-- Mobile bar -->
<div class="mobile-bar" id="mobile-bar">
  <button class="icon-btn" id="hamburger-btn" aria-label="Open menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="mobile-brand">DTS208PREP</div>
  <button class="theme-btn" id="theme-btn-mob" aria-label="Toggle theme"></button>
</div>

<!-- Sidebar overlay -->
<div class="overlay" id="overlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div>
      <div class="brand">DTS208PREP</div>
      <div class="brand-sub">Edge Computing, University of Lagos</div>
    </div>
    <button class="theme-btn" id="theme-btn" aria-label="Toggle theme"></button>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 16 16" fill="currentColor">
      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.656a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
    </svg>
    <input class="search-input" id="search-input" type="text" placeholder="Search topics and sections..." autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>

  <nav class="topic-list" id="topic-list"></nav>
</aside>

<!-- Main -->
<main class="main" id="main">
  <div class="content-wrap" id="content-wrap">
    <div class="center-state">
      <div class="big">Loading course data...</div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" crossorigin="anonymous"></script>
<script>
/* ===== THEME ===== */
const SUN = `<svg viewBox="0 0 15 15" fill="currentColor"><path d="M7.5 0a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0v-1A.5.5 0 0 1 7.5 0Zm0 13a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-1 0v-1a.5.5 0 0 1 .5-.5ZM0 7.5A.5.5 0 0 1 .5 7h1a.5.5 0 0 1 0 1H.5A.5.5 0 0 1 0 7.5Zm13 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5ZM2.197 2.197a.5.5 0 0 1 .707 0l.707.707a.5.5 0 1 1-.707.707l-.707-.707a.5.5 0 0 1 0-.707Zm9.192 9.192a.5.5 0 0 1 .707 0l.707.707a.5.5 0 0 1-.707.707l-.707-.707a.5.5 0 0 1 0-.707Zm0-9.899a.5.5 0 0 0-.707 0l-.707.707a.5.5 0 0 0 .707.707l.707-.707a.5.5 0 0 0 0-.707ZM3.611 11.389a.5.5 0 0 0-.707 0l-.707.707a.5.5 0 0 0 .707.707l.707-.707a.5.5 0 0 0 0-.707ZM7.5 4a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>`;
const MOON = `<svg viewBox="0 0 15 15" fill="currentColor"><path d="M2.89.907A6.5 6.5 0 1 0 14.093 12.11 5.5 5.5 0 0 1 2.89.907Z"/></svg>`;

let theme = localStorage.getItem('dts208-theme') || 'light';

function applyTheme(t) {
  theme = t;
  document.documentElement.dataset.theme = t;
  localStorage.setItem('dts208-theme', t);
  const icon = t === 'dark' ? SUN : MOON;
  document.querySelectorAll('.theme-btn').forEach(btn => { btn.innerHTML = icon; });
}

function toggleTheme() { applyTheme(theme === 'dark' ? 'light' : 'dark'); }

/* ===== STATE ===== */
let data = null;
let currentId = null;
let searchIdx = [];

/* ===== INIT ===== */
async function init() {
  applyTheme(theme);

  document.getElementById('theme-btn').onclick = toggleTheme;
  document.getElementById('theme-btn-mob').onclick = toggleTheme;
  document.getElementById('hamburger-btn').onclick = openSidebar;
  document.getElementById('overlay').onclick = closeSidebar;

  const input = document.getElementById('search-input');
  input.addEventListener('input', onSearch);
  input.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) closeSearch();
  });

  try {
    const r = await fetch('./dts208_master.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
    onLoaded();
  } catch (err) {
    document.getElementById('content-wrap').innerHTML =
      `<div class="center-state"><div class="big">Could not load course data</div><div class="small">${esc(err.message)}</div></div>`;
  }
}

function onLoaded() {
  buildIdx();
  buildSidebar();
  selectTopic(data.topics[0].id);
}

/* ===== SIDEBAR ===== */
function buildSidebar() {
  const list = document.getElementById('topic-list');
  list.innerHTML = '';
  data.topics.forEach((topic, i) => {
    const m = topic.title.match(/^(\d+)\.\s+(.+)/);
    const num = m ? m[1] : String(i + 1);
    const name = m ? m[2] : topic.title;
    const el = document.createElement('div');
    el.className = 'topic-item';
    el.dataset.id = topic.id;
    el.innerHTML = `<span class="topic-num">${num}</span><span class="topic-name">${esc(name)}</span>`;
    el.onclick = () => { selectTopic(topic.id); closeSidebar(); };
    list.appendChild(el);
  });
}

function selectTopic(id) {
  currentId = id;
  document.querySelectorAll('.topic-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  const topic = data.topics.find(t => t.id === id);
  if (topic) renderTopic(topic);
  document.getElementById('main').scrollTo({ top: 0 });
}

/* ===== RENDER TOPIC ===== */
function renderTopic(topic) {
  const m = topic.title.match(/^(\d+)\.\s+(.+)/);
  const num = m ? m[1] : '';
  const name = m ? m[2] : topic.title;

  let html = `<div class="topic-header">
    <div class="topic-eyebrow">Topic ${esc(num)}</div>
    <h1>${esc(name)}</h1>
  </div>`;

  topic.pages.forEach(page => { html += renderPage(page); });

  if (topic.labTest) html += renderLabTest(topic.labTest, topic.id);

  const wrap = document.getElementById('content-wrap');
  wrap.innerHTML = html;

  renderKatex(wrap);
  wireLabTest(wrap);
}

/* ===== RENDER PAGE ===== */
function renderPage(page) {
  let h = `<div class="page-block" id="s${page.page_number}">`;
  h += `<h2 class="section-heading">${esc(page.section)}</h2>`;

  if (page.text_content && page.text_content.trim()) {
    h += `<div class="page-text">${toParas(page.text_content)}</div>`;
  }

  const fmls = page.formulas || [];
  if (fmls.length) {
    h += `<div class="formulas-block">`;
    fmls.forEach(f => {
      h += `<div class="formula-card">
        <div class="formula-display" data-latex="${esc(f.latex)}"></div>
        ${f.context ? `<div class="formula-context">${esc(f.context)}</div>` : ''}
      </div>`;
    });
    h += `</div>`;
  }

  const diags = (page.diagrams || []).filter(d => d.svg && d.svg.trim());
  if (diags.length) {
    h += `<div class="diagrams-block">`;
    diags.forEach(d => {
      h += `<div class="diagram-card">
        <div class="diagram-caption">${esc(d.title)}</div>
        <div class="diagram-svg-wrap">${d.svg}</div>
        ${d.description ? `<div class="diagram-desc">${esc(d.description)}</div>` : ''}
      </div>`;
    });
    h += `</div>`;
  }

  const tbls = page.tables || [];
  if (tbls.length) {
    h += `<div class="tables-block">`;
    tbls.forEach(t => { h += renderTable(t); });
    h += `</div>`;
  }

  const assigns = page.assignments || [];
  if (assigns.length) {
    h += `<div class="assignments-block">`;
    assigns.forEach(a => {
      h += `<div class="assignment-callout">
        <div class="assignment-label">Assignment</div>
        <div class="assignment-text">${esc(a)}</div>
      </div>`;
    });
    h += `</div>`;
  }

  h += `</div>`;
  return h;
}

/* ===== RENDER TABLE ===== */
function renderTable(t) {
  let h = `<div class="table-scroll"><table><thead><tr>`;
  (t.headers || []).forEach(hd => { h += `<th>${esc(hd)}</th>`; });
  h += `</tr></thead><tbody>`;
  (t.rows || []).forEach(row => {
    h += `<tr>`;
    row.forEach(cell => { h += `<td>${esc(cell)}</td>`; });
    h += `</tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

/* ===== RENDER LAB TEST ===== */
function renderLabTest(lab, topicId) {
  const laps = [['lap1', lab.lap1], ['lap2', lab.lap2]].filter(([, v]) => v);
  if (!laps.length) return '';

  let h = `<div class="lab-section" id="lab-${topicId}">
    <div class="lab-head">
      <div class="lab-eyebrow">Test Yourself</div>
      <div class="lab-head-title">Lab Test</div>
    </div>
    <div class="lab-tabs">`;

  laps.forEach(([key, lap], i) => {
    h += `<button class="lab-tab${i === 0 ? ' active' : ''}" data-lap="${key}">${esc(lap.title)}</button>`;
  });

  h += `</div><div class="lab-body">`;

  laps.forEach(([key, lap], i) => {
    const qCount = lap.questions.length;
    h += `<div class="lap-panel${i === 0 ? ' active' : ''}" data-lap="${key}">
      <div class="lap-title">${esc(lap.title)}</div>
      <div class="lap-progress" data-prog="${key}">0 of ${qCount} revealed</div>`;

    lap.questions.forEach((q, qi) => {
      h += `<div class="q-card">
        <div class="q-num">Question ${qi + 1} of ${qCount}</div>
        <div class="q-text">${esc(q.q)}</div>
        <button class="reveal-btn" data-shown="0" data-lap="${key}">Show Answer</button>
        <div class="answer-block">${esc(q.a)}</div>
      </div>`;
    });

    h += `</div>`;
  });

  h += `</div></div>`;
  return h;
}

/* ===== WIRE LAB TEST ===== */
function wireLabTest(container) {
  container.querySelectorAll('.lab-tab').forEach(tab => {
    tab.onclick = () => {
      const lap = tab.dataset.lap;
      const sec = tab.closest('.lab-section');
      sec.querySelectorAll('.lab-tab').forEach(t => t.classList.toggle('active', t.dataset.lap === lap));
      sec.querySelectorAll('.lap-panel').forEach(p => p.classList.toggle('active', p.dataset.lap === lap));
    };
  });

  container.querySelectorAll('.reveal-btn').forEach(btn => {
    btn.onclick = () => {
      const shown = btn.dataset.shown === '1';
      const card = btn.closest('.q-card');
      const ans = card.querySelector('.answer-block');
      if (shown) {
        ans.classList.remove('open');
        btn.classList.remove('shown');
        btn.textContent = 'Show Answer';
        btn.dataset.shown = '0';
      } else {
        ans.classList.add('open');
        btn.classList.add('shown');
        btn.textContent = 'Hide Answer';
        btn.dataset.shown = '1';
      }
      updateProgress(btn.closest('.lap-panel'));
    };
  });
}

function updateProgress(panel) {
  if (!panel) return;
  const key = panel.dataset.lap;
  const total = panel.querySelectorAll('.reveal-btn').length;
  const revealed = panel.querySelectorAll('.reveal-btn[data-shown="1"]').length;
  const prog = panel.querySelector(`[data-prog="${key}"]`);
  if (prog) prog.textContent = `${revealed} of ${total} revealed`;
}

/* ===== KATEX ===== */
function renderKatex(container) {
  if (!window.katex) return;
  container.querySelectorAll('.formula-display[data-latex]').forEach(el => {
    try {
      el.innerHTML = katex.renderToString(el.dataset.latex, { displayMode: true, throwOnError: false });
    } catch {
      el.innerHTML = `<div class="formula-raw">${esc(el.dataset.latex)}</div>`;
    }
    el.removeAttribute('data-latex');
  });
}

/* ===== SEARCH ===== */
function buildIdx() {
  searchIdx = [];
  data.topics.forEach(topic => {
    const m = topic.title.match(/^(\d+)\.\s+(.+)/);
    const name = m ? m[2] : topic.title;
    searchIdx.push({ type: 'topic', id: topic.id, text: name, sub: null });
    (topic.pages || []).forEach(pg => {
      searchIdx.push({ type: 'section', id: topic.id, page: pg.page_number, text: pg.section, sub: name });
    });
  });
}

function onSearch(e) {
  const q = e.target.value.trim().toLowerCase();
  const box = document.getElementById('search-results');
  if (!q) { closeSearch(); return; }

  const hits = searchIdx.filter(x => x.text.toLowerCase().includes(q)).slice(0, 18);

  if (!hits.length) {
    box.innerHTML = `<div class="sr-empty">No results for "${esc(q)}"</div>`;
    box.classList.add('open');
    return;
  }

  box.innerHTML = hits.map(x =>
    `<div class="sr-item" data-id="${x.id}" data-page="${x.page || ''}">
      <div class="sr-main"><span class="sr-badge">${x.type === 'topic' ? 'Topic' : 'Section'}</span>${esc(x.text)}</div>
      ${x.sub ? `<div class="sr-sub">${esc(x.sub)}</div>` : ''}
    </div>`
  ).join('');

  box.classList.add('open');

  box.querySelectorAll('.sr-item').forEach(el => {
    el.onclick = () => {
      selectTopic(el.dataset.id);
      if (el.dataset.page) {
        setTimeout(() => {
          const target = document.getElementById('s' + el.dataset.page);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      }
      closeSearch();
      document.getElementById('search-input').value = '';
      closeSidebar();
    };
  });
}

function closeSearch() {
  document.getElementById('search-results').classList.remove('open');
}

/* ===== MOBILE SIDEBAR ===== */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  document.body.style.overflow = '';
}

/* ===== HELPERS ===== */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toParas(text) {
  return text.split(/\n\n+/).map(para => {
    const t = para.trim();
    if (!t) return '';
    const lines = t.split('\n').map(l => esc(l.trim())).filter(Boolean);
    return `<p>${lines.join('<br>')}</p>`;
  }).filter(Boolean).join('');
}

init();
</script>
