<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTS208PREP</title>
  <style>
    /* ══════════════════════════════════════════════
       DESIGN TOKENS
       Light theme on :root, dark overrides below
    ══════════════════════════════════════════════ */
    :root {
      --bg:             #FFF7F3;
      --bg-sidebar:     #FDEEE5;
      --bg-card:        #FFFBF9;
      --accent:         #FF9466;
      --accent-muted:   rgba(255, 148, 102, 0.11);
      --accent-border:  rgba(255, 148, 102, 0.45);
      --text-primary:   #2B2320;
      --text-secondary: #896E67;
      --text-sidebar:   #55403B;
      --border:         #E8D5C9;
      --border-subtle:  #F2E3DA;
      --shadow:         rgba(43, 35, 32, 0.05);

      --sidebar-w:      248px;
      --sidebar-w-col:  60px;
      --t:              0.22s ease;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:             #14120F;
        --bg-sidebar:     #1A1712;
        --bg-card:        #1D1A16;
        --accent:         #FF9466;
        --accent-muted:   rgba(255, 148, 102, 0.14);
        --accent-border:  rgba(255, 148, 102, 0.50);
        --text-primary:   #F5EDE7;
        --text-secondary: #9A837B;
        --text-sidebar:   #C8B4AC;
        --border:         #2E2520;
        --border-subtle:  #231E1A;
        --shadow:         rgba(0, 0, 0, 0.28);
      }
    }

    :root[data-theme="dark"] {
      --bg:             #14120F;
      --bg-sidebar:     #1A1712;
      --bg-card:        #1D1A16;
      --accent:         #FF9466;
      --accent-muted:   rgba(255, 148, 102, 0.14);
      --accent-border:  rgba(255, 148, 102, 0.50);
      --text-primary:   #F5EDE7;
      --text-secondary: #9A837B;
      --text-sidebar:   #C8B4AC;
      --border:         #2E2520;
      --border-subtle:  #231E1A;
      --shadow:         rgba(0, 0, 0, 0.28);
    }

    /* ══════════════════════════════════════════════
       RESET & BASE
    ══════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      transition: background var(--t), color var(--t);
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ══════════════════════════════════════════════
       APP SHELL
    ══════════════════════════════════════════════ */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ══════════════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition:
        width var(--t),
        min-width var(--t),
        background var(--t),
        border-color var(--t);
    }

    .sidebar.is-col {
      width: var(--sidebar-w-col);
      min-width: var(--sidebar-w-col);
    }

    /* — Header — */
    .s-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px 15px 16px;
      border-bottom: 1px solid var(--border-subtle);
      min-height: 58px;
      flex-shrink: 0;
      transition: border-color var(--t);
    }

    .s-brand {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.09em;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      opacity: 1;
      max-width: 160px;
      transition: opacity var(--t), max-width var(--t);
    }

    .is-col .s-brand {
      opacity: 0;
      max-width: 0;
    }

    .s-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 7px;
      border-radius: 7px;
      color: var(--text-secondary);
      flex-shrink: 0;
      transition: background var(--t), color var(--t);
    }

    .s-toggle:hover {
      background: var(--accent-muted);
      color: var(--accent);
    }

    .s-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .s-toggle svg { width: 17px; height: 17px; display: block; }

    /* — Search — */
    .s-search {
      padding: 10px 10px 8px;
      flex-shrink: 0;
      transition: padding var(--t);
    }

    .is-col .s-search {
      padding: 10px 6px 8px;
      display: flex;
      justify-content: center;
    }

    .s-search-inner {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      transition: background var(--t), border-color var(--t);
    }

    .s-search-inner:focus-within {
      border-color: var(--accent-border);
    }

    .s-search-icon {
      flex-shrink: 0;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      transition: color var(--t);
    }

    .s-search-icon svg { width: 13px; height: 13px; display: block; }

    .s-search-input {
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-primary);
      min-width: 0;
      width: 100%;
      opacity: 1;
      transition: opacity var(--t), width var(--t), color var(--t);
    }

    .s-search-input::placeholder { color: var(--text-secondary); }

    .is-col .s-search-input {
      opacity: 0;
      width: 0;
      pointer-events: none;
    }

    /* — Topic list — */
    .s-topics {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 0 20px;
    }

    .s-topics::-webkit-scrollbar { width: 3px; }
    .s-topics::-webkit-scrollbar-track { background: transparent; }
    .s-topics::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .s-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding: 10px 16px 5px;
      white-space: nowrap;
      overflow: hidden;
      transition:
        opacity var(--t),
        height var(--t),
        padding var(--t),
        color var(--t);
    }

    .is-col .s-label {
      opacity: 0;
      height: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .topic-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 8px 13px;
      cursor: pointer;
      border-left: 3px solid transparent;
      position: relative;
      color: var(--text-sidebar);
      transition:
        background var(--t),
        border-color var(--t),
        color var(--t),
        padding var(--t),
        justify-content var(--t);
    }

    .is-col .topic-item {
      padding: 8px 0;
      justify-content: center;
    }

    .topic-item:hover { background: var(--accent-muted); color: var(--text-primary); }

    .topic-item.is-active {
      background: var(--accent-muted);
      border-left-color: var(--accent);
      color: var(--text-primary);
    }

    /* Tooltip (collapsed only) */
    .is-col .topic-item::after {
      content: attr(data-title);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--text-primary);
      color: var(--bg);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      z-index: 999;
      box-shadow: 0 2px 8px var(--shadow);
      transition: opacity 0.14s ease;
    }

    .is-col .topic-item:hover::after { opacity: 1; }

    .topic-icon {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: var(--accent-muted);
      color: var(--accent);
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Segoe UI', monospace, sans-serif;
      transition: background var(--t), color var(--t);
    }

    .topic-item.is-active .topic-icon {
      background: var(--accent);
      color: #fff;
    }

    .topic-name {
      font-size: 13px;
      font-weight: 450;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
      opacity: 1;
      transition: opacity var(--t);
    }

    .is-col .topic-name {
      opacity: 0;
      flex: 0;
      width: 0;
    }

    /* ══════════════════════════════════════════════
       MAIN
    ══════════════════════════════════════════════ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* — Top bar — */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 28px;
      height: 56px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: 0 1px 3px var(--shadow);
      transition:
        background var(--t),
        border-color var(--t),
        box-shadow var(--t);
    }

    .topbar-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      transition: color var(--t);
    }

    .theme-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 11px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
      transition:
        background var(--t),
        border-color var(--t),
        color var(--t);
    }

    .theme-btn:hover {
      border-color: var(--accent-border);
      color: var(--accent);
    }

    .theme-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-btn-icon { font-size: 14px; line-height: 1; }

    /* — Scrollable content — */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 40px 44px 72px;
    }

    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ══════════════════════════════════════════════
       WELCOME STATE
    ══════════════════════════════════════════════ */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      text-align: center;
      color: var(--text-secondary);
    }

    .welcome-glyph {
      font-size: 38px;
      opacity: 0.18;
      margin-bottom: 8px;
      user-select: none;
    }

    .welcome h2 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      text-wrap: balance;
      transition: color var(--t);
    }

    .welcome p {
      font-size: 13.5px;
      line-height: 1.6;
      max-width: 280px;
    }

    /* ══════════════════════════════════════════════
       TOPIC CONTENT
    ══════════════════════════════════════════════ */
    .topic-heading {
      font-size: 27px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      text-wrap: balance;
      letter-spacing: -0.015em;
      margin-bottom: 6px;
      max-width: 640px;
      transition: color var(--t);
    }

    .topic-crumb {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      transition: color var(--t);
    }

    .topic-crumb em {
      font-style: normal;
      color: var(--accent);
      font-weight: 600;
    }

    .ph-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 28px 24px;
      max-width: 680px;
      transition: background var(--t), border-color var(--t);
    }

    .ph-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .ph-tag::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .ph-body {
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 520px;
      transition: color var(--t);
    }

    .ph-body strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .ph-rule {
      height: 1px;
      background: var(--border-subtle);
      margin: 22px 0;
      transition: background var(--t);
    }

    .ph-slots {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .ph-slot {
      height: 68px;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      transition: background var(--t), border-color var(--t), color var(--t);
    }

    /* ══════════════════════════════════════════════
       MOTION PREFERENCE
    ══════════════════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ════════════ SIDEBAR ════════════ -->
  <aside id="sidebar" class="sidebar" role="navigation" aria-label="Course topics">

    <div class="s-head">
      <span class="s-brand" aria-hidden="true">DTS208PREP</span>
      <button class="s-toggle" id="sidebarToggle"
              aria-label="Toggle sidebar" aria-expanded="true">
        <svg viewBox="0 0 17 17" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <line x1="2" y1="4.5" x2="15" y2="4.5"/>
          <line x1="2" y1="8.5" x2="15" y2="8.5"/>
          <line x1="2" y1="12.5" x2="15" y2="12.5"/>
        </svg>
      </button>
    </div>

    <div class="s-search">
      <div class="s-search-inner" role="search">
        <span class="s-search-icon" aria-hidden="true">
          <svg viewBox="0 0 13 13" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="5.5" cy="5.5" r="4"/>
            <line x1="8.8" y1="8.8" x2="12" y2="12"/>
          </svg>
        </span>
        <input class="s-search-input" type="text"
               placeholder="Search topics…"
               aria-label="Search topics — coming soon"
               disabled tabindex="-1"/>
      </div>
    </div>

    <div class="s-topics" id="topicList" role="list" aria-label="Topic list"></div>

  </aside>

  <!-- ════════════ MAIN ════════════ -->
  <div class="main">

    <header class="topbar">
      <span class="topbar-title" id="topbarTitle">DTS208PREP</span>
      <button class="theme-btn" id="themeToggle" aria-label="Toggle light/dark theme">
        <span class="theme-btn-icon" id="themeIcon" aria-hidden="true">☀️</span>
        <span id="themeLabel">Light</span>
      </button>
    </header>

    <main class="content" id="mainContent">
      <div class="welcome" id="welcomeState">
        <div class="welcome-glyph" aria-hidden="true">◈</div>
        <h2>Select a topic to begin</h2>
        <p>Choose from the sidebar to open study content for that section.</p>
      </div>
      <div id="topicView" hidden></div>
    </main>

  </div>
</div>

<script>
  /* ════════════════════════════════════════════════════════
     TOPIC DATA
     Structure ready for merge with notes_data.json
     content field will hold: {
       text_content, formulas, diagrams (SVG), tables, assignments
     }
  ════════════════════════════════════════════════════════ */
  const topics = [
    {
      id: "edge-fundamentals",
      title: "Edge Computing Fundamentals",
      icon: "EF",
      content: null
    },
    {
      id: "edge-hardware",
      title: "Edge Hardware and Devices",
      icon: "HW",
      content: null
    },
    {
      id: "edge-os",
      title: "Edge OS and Runtime Environments",
      icon: "OS",
      content: null
    },
    {
      id: "containerization",
      title: "Containerization for Edge (Docker)",
      icon: "CT",
      content: null
    },
    {
      id: "edge-data",
      title: "Edge Data Processing and Streaming Analytics",
      icon: "DP",
      content: null
    },
    {
      id: "protocols",
      title: "Communication Protocols (MQTT, CoAP, WebSocket)",
      icon: "CP",
      content: null
    },
    {
      id: "edge-ml",
      title: "Edge Machine Learning and Quantization",
      icon: "ML",
      content: null
    },
    {
      id: "edge-security",
      title: "Edge Security",
      icon: "SE",
      content: null
    },
    {
      id: "edge-management",
      title: "Edge Management and Orchestration",
      icon: "MG",
      content: null
    },
    {
      id: "edge-cloud",
      title: "Edge-to-Cloud Integration",
      icon: "CI",
      content: null
    },
    {
      id: "linear-regression",
      title: "Multiple Linear Regression (Math + Code)",
      icon: "LR",
      content: null
    }
  ];

  /* ════════════════════════════════════════════════════════
     STATE
  ════════════════════════════════════════════════════════ */
  let activeId   = null;
  let collapsed  = false;
  let dark       = false;

  /* ════════════════════════════════════════════════════════
     THEME
  ════════════════════════════════════════════════════════ */
  function setTheme(isDark) {
    dark = isDark;
    document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
    document.getElementById('themeIcon').textContent  = isDark ? '🌙' : '☀️';
    document.getElementById('themeLabel').textContent = isDark ? 'Dark' : 'Light';
    try { localStorage.setItem('dts208prep:theme', isDark ? 'dark' : 'light'); } catch (_) {}
  }

  (function initTheme() {
    let saved;
    try { saved = localStorage.getItem('dts208prep:theme'); } catch (_) {}
    if (saved === 'dark')  { setTheme(true);  return; }
    if (saved === 'light') { setTheme(false); return; }
    setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
  })();

  document.getElementById('themeToggle')
    .addEventListener('click', () => setTheme(!dark));

  /* ════════════════════════════════════════════════════════
     SIDEBAR COLLAPSE
  ════════════════════════════════════════════════════════ */
  const sidebar   = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('sidebarToggle');

  function setSidebar(isCol) {
    collapsed = isCol;
    sidebar.classList.toggle('is-col', isCol);
    toggleBtn.setAttribute('aria-expanded', String(!isCol));
  }

  toggleBtn.addEventListener('click', () => setSidebar(!collapsed));

  /* ════════════════════════════════════════════════════════
     RENDER SIDEBAR
  ════════════════════════════════════════════════════════ */
  function renderSidebar() {
    const list = document.getElementById('topicList');
    list.innerHTML = '';

    const lbl = document.createElement('div');
    lbl.className = 's-label';
    lbl.textContent = 'Course Topics';
    lbl.setAttribute('aria-hidden', 'true');
    list.appendChild(lbl);

    topics.forEach(topic => {
      const el = document.createElement('div');
      el.className = 'topic-item' + (topic.id === activeId ? ' is-active' : '');
      el.setAttribute('role', 'listitem');
      el.setAttribute('tabindex', '0');
      el.dataset.id    = topic.id;
      el.dataset.title = topic.title;
      el.setAttribute('aria-label', topic.title);
      el.setAttribute('aria-current', topic.id === activeId ? 'true' : 'false');

      el.innerHTML =
        `<span class="topic-icon" aria-hidden="true">${esc(topic.icon)}</span>` +
        `<span class="topic-name">${esc(topic.title)}</span>`;

      el.addEventListener('click', () => selectTopic(topic.id));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectTopic(topic.id);
        }
      });

      list.appendChild(el);
    });
  }

  /* ════════════════════════════════════════════════════════
     TOPIC SELECTION
  ════════════════════════════════════════════════════════ */
  function selectTopic(id) {
    activeId = id;
    const topic = topics.find(t => t.id === id);
    if (!topic) return;

    document.querySelectorAll('.topic-item').forEach(el => {
      const active = el.dataset.id === id;
      el.classList.toggle('is-active', active);
      el.setAttribute('aria-current', String(active));
    });

    document.getElementById('topbarTitle').textContent = topic.title;
    document.getElementById('welcomeState').hidden = true;

    const view = document.getElementById('topicView');
    view.hidden = false;
    view.innerHTML = topic.content
      ? renderContent(topic)
      : renderPlaceholder(topic);
  }

  function renderPlaceholder(topic) {
    return `
      <h1 class="topic-heading">${esc(topic.title)}</h1>
      <p class="topic-crumb">
        DTS208 &mdash; Fundamentals of Edge Computing &mdash;
        <em>University of Lagos</em>
